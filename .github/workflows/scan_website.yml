name: Scan Website with MalGuard AI

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Website URL to scan (e.g., https://example.com)"
        required: true
        default: "https://example.com"
        type: string
  # Optional: Schedule weekly recurring scans
  # schedule:
  #   - cron: '0 0 * * 0'

jobs:
  scan-website:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd malguard-ai && pip install -r requirements.txt || true

    - name: Run MalGuard Website Security Scan
      id: scan
      run: |
        cd malguard-ai
        echo "Scanning URL: ${{ inputs.target_url }}"
        python cli.py --url "${{ inputs.target_url }}" --no-banner
        
        # Also generate JSON output for GitHub Step Summary
        python cli.py --url "${{ inputs.target_url }}" --json --no-banner > ../scan_report.json
      continue-on-error: true

    - name: Generate GitHub Actions Step Summary
      run: |
        echo "## 🛡️ MalGuard AI Website Security Report" >> $GITHUB_STEP_SUMMARY
        echo "**Target URL:** \`${{ inputs.target_url }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Scan Date:** $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f scan_report.json ]; then
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat scan_report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
